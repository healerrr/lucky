<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>李明 | 前端工程师</title>

    <!-- 关键：Open Graph 标签（微信链接卡片依赖） -->
    <meta property="og:title" content="李明 | 前端工程师 @ 数字未来科技" />
    <meta property="og:description" content="热爱 Vue & React，专注用户体验与性能优化。欢迎交流合作！" />
    <meta property="og:image" content="https://yourdomain.com/avatar.jpg" />
    <meta property="og:url" content="https://healerrr.github.io/lucky/" />
    <meta property="og:type" content="website" />

    <!-- 微信识别备用描述（非必需，但建议加上） -->
    <meta name="description" content="李明 | 前端工程师 @ 数字未来科技 - 热爱 Vue & React，专注用户体验与性能优化。" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #f9f7fe 0%, #e6f0ff 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #333;
        }

        .card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 12px 40px rgba(0, 30, 100, 0.12);
            width: 100%;
            max-width: 420px;
            overflow: hidden;
            text-align: center;
            padding: 40px 24px;
        }

        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #5d7af5;
            margin-bottom: 20px;
            background-color: #f0f4ff;
        }

        .name {
            font-size: 26px;
            font-weight: 700;
            color: #222;
            margin-bottom: 8px;
        }

        .title {
            font-size: 18px;
            color: #555;
            margin-bottom: 6px;
        }

        .company {
            font-size: 15px;
            color: #777;
            margin-bottom: 24px;
        }

        .divider {
            height: 1px;
            background: #eee;
            margin: 20px 0;
        }

        .contact {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 10px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
            color: #5d7af5;
            font-size: 16px;
            padding: 8px 16px;
            border-radius: 12px;
            background: #f0f4ff;
            transition: all 0.2s;
        }

        .contact-item:hover {
            background: #e0e8ff;
            transform: translateY(-2px);
        }

        .footer {
            margin-top: 24px;
            font-size: 13px;
            color: #999;
        }
    </style>
</head>

<body>
    <div class="card">
        <!-- 头像：请替换为你的 HTTPS 图片地址 -->
        <img class="avatar" src="https://yourdomain.com/avatar.jpg" alt="李明" />

        <div class="name">李明</div>
        <div class="title">前端工程师</div>
        <div class="company">数字未来科技有限公司</div>

        <div class="divider"></div>

        <div class="contact">
            <a class="contact-item" href="tel:13912345678">
                📞 电话：139****5678
            </a>
            <a class="contact-item" href="mailto:liming@example.com">
                ✉️ 邮箱：liming@example.com
            </a>
            <a class="contact-item" href="https://github.com/yourname" target="_blank" rel="noopener">
                💼 GitHub：@yourname
            </a>
        </div>

        <div class="footer">
            点击上方信息可直接拨号或发邮件
        </div>
    </div>
</body>

</html>
